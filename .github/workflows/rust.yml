name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The runner image carries an older stable, so install the exact floor that
    # `rust-version` in Cargo.toml declares. Deriving it keeps the two from
    # drifting: this job always builds with the oldest compiler the crate
    # claims to support.
    - name: Read the declared Rust version
      id: msrv
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^rust-version *= *"\(.*\)"$/\1/p' Cargo.toml)"
        if [ -z "$version" ]; then
          echo "error: Cargo.toml declares no rust-version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install Rust ${{ steps.msrv.outputs.version }}
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
